name: Feature proposal
description: Propose a capability or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Community need
      description: Describe the user, community, or operational problem.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and success criteria without prescribing implementation.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and assumptions
      description: Note jurisdiction, devices, tariffs, units, time zones, privacy, or safety constraints.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or simpler options considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
